name: Deploy CDK Application

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  # PRs run the checks and `cdk synth` only. The deploy step below is skipped for them.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '22' # matches the Lambda runtime cdk-nextjs uses (NODEJS_22_X)
  AWS_REGION: 'ap-southeast-2'
  CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
  CDK_DEFAULT_REGION: 'ap-southeast-2'

jobs:
  checks:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Also runs `prisma generate` (postinstall).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Unit tests (Vitest), Server Action tests with Prisma mocked, and CDK assertion tests.
      - name: Unit tests
        run: npm run test:coverage

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # No database in CI: the smoke tests only cover pages that don't query it.
      - name: Build
        run: npm run build

      - name: Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Synth and deploy to AWS
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Also runs `prisma generate` (postinstall).
      - name: Install dependencies
        run: npm ci

      # cdk-nextjs 0.7 stages `.env.production` into the Lambda package and loads it at
      # startup. Without this step the deployed app has no database or auth settings.
      # Only written for deploys, so PR builds from forks never see the secrets.
      - name: Write runtime environment
        if: github.event_name == 'push'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          {
            printf 'DATABASE_URL="%s"\n' "$DATABASE_URL"
            printf 'AUTH_SECRET="%s"\n' "$AUTH_SECRET"
            printf 'AUTH_GOOGLE_ID="%s"\n' "$AUTH_GOOGLE_ID"
            printf 'AUTH_GOOGLE_SECRET="%s"\n' "$AUTH_GOOGLE_SECRET"
            printf 'ADMIN_EMAILS="%s"\n' "$ADMIN_EMAILS"
            printf 'AUTH_TRUST_HOST=true\n'
          } > .env.production

      # Synth runs `npm run build` (prisma generate + next build) through the cdk-nextjs adapter.
      - name: CDK synth
        run: npx cdk synth --quiet

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: GitHubActions-CDK-Deploy

      # Uses the project's pinned aws-cdk devDependency, not a global @latest install,
      # and deploys the assembly synthesised above instead of building again.
      # No Docker needed: cdk-nextjs 0.7 deploys a zip Lambda.
      - name: CDK deploy
        if: github.event_name == 'push'
        run: npx cdk deploy --app cdk.out --require-approval never --all --outputs-file cdk-outputs.json

      # Fails the run if the new version doesn't serve the health route and a page that reads
      # from the database.
      - name: Smoke-test the live site
        if: github.event_name == 'push'
        run: |
          url=$(jq -r '.nextjs.AppUrl' cdk-outputs.json)
          echo "Testing $url"
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors "$url/api/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 10 -o /dev/null "$url/match/1"
